version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - SQ_LOG_LEVEL=INFO
    volumes:
      - ./backend/db:/app/backend/db
      - ./backend/logs:/app/backend/logs
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis 缓存 (可选 — profile: full)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    profiles:
      - full

  # PostgreSQL (可选 — profile: full)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_query
      POSTGRES_USER: smart_query
      POSTGRES_PASSWORD: smart_query
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - full

  # ChromaDB 向量服务 (可选 — profile: full)
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db/chroma:/chroma/chroma
    restart: unless-stopped
    profiles:
      - full

volumes:
  redis_data:
  pg_data:
