# ═══════════════════════════════════════════
# 业务逻辑 (术语 → SQL 条件)
# ═══════════════════════════════════════════
business_logic:
  大额订单:
    condition: "contract_amount > 10000"
    description: "合同金额超过1亿元的订单"
  大单:
    condition: "contract_amount > 10000"
    description: "合同金额超过1亿元"
  停滞预警:
    condition: "follow_days_gap > 30 OR status = '停滞预警'"
    description: "超过30天无跟进记录或状态为停滞预警的商机"
  严重逾期:
    condition: "overdue_days > 90"
    description: "逾期超过90天的应收账款"
  高风险:
    condition: "overdue_days > 90 OR status = '停滞预警'"
    description: "逾期>90天 或 停滞预警"
  已中标:
    condition: "is_won = 1"
    description: "已中标的项目"
  已签约:
    condition: "status = '已签约'"
    description: "已签订合同"

