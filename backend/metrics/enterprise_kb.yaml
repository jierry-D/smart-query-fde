# ═══════════════════════════════════════════════════════════
# 企业知识库 — 通用模板 (可按项目自定义)
# ═══════════════════════════════════════════════════════════
#
# 此文件定义企业级的通用术语和规则。
# 数据集级知识库放在 dataset_kb/ 目录下，优先级更高。
#
# 使用方法:
#   1. 复制此文件并根据业务领域修改
#   2. 同义词: 用户口语 → 标准指标名
#   3. 业务逻辑: 业务术语 → SQL条件
#   4. 字段映射: 展示名 → 数据库字段名
#   5. 业务域: 按实际组织架构划分
#
# ═══════════════════════════════════════════════════════════

# ── 同义词映射 (用户用语 → 标准术语) ──
# 示例: 将用户常用口语映射到系统中注册的指标名
synonyms:
  # 示例 (可替换为你的业务术语):
  # 销售额: "月度销售总额"
  # 用户数: "活跃用户总数"
  # 转化率: "用户付费转化率"

# ── 业务逻辑 (术语 → SQL条件) ──
# 示例: 将业务概念映射到数据库筛选条件
business_logic:
  # 示例:
  # VIP客户:
  #   condition: "customer_level >= 3"
  #   description: "客户等级3级以上"

# ── 字段映射 (展示名 → 数据库字段) ──
field_mapping:
  # 示例:
  # 金额: "total_amount"
  # 日期: "created_date"
  # 区域: "region"

# ── 时间智能 (全局生效) ──
time_intelligence:
  ytd:
    description: "年初至当前日期的累计值"
    keywords: ["今年", "年初至今", "YTD", "本年度", "年度"]
  mtd:
    description: "月初至当前日期的累计值"
    keywords: ["本月", "MTD", "本月份", "当月"]
  qtd:
    description: "季初至当前日期的累计值"
    keywords: ["本季度", "本季", "QTD"]
  yoy:
    description: "与去年同期相比的增长率"
    keywords: ["同比", "YoY", "较去年", "去年同期"]
  mom:
    description: "与上月相比的增长率"
    keywords: ["环比", "MoM", "较上月"]
  target_completion:
    description: "实际值/目标值×100%"
    keywords: ["目标完成率", "达成率", "完成情况"]

# ── 业务域 (按组织架构划分) ──
domains: []
  # 示例:
  # - name: "销售管理"
  #   tables: ["orders", "customers"]
  #   owner: "销售部"
  #   visible_to: ["admin", "leader", "employee"]
  # - name: "财务管理"
  #   tables: ["invoices", "payments"]
  #   owner: "财务部"
  #   visible_to: ["admin", "leader"]
