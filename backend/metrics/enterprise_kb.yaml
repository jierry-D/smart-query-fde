  合同金额: "contract_amount"
  中标金额: "contract_amount"
  签约金额: "contract_amount"
  中标日期: "bid_date"
  签约日期: "signed_date"
  合同日期: "signed_date"
  区域: "region"
  地区: "region"
  城市: "region"
  地市: "region"
  业务线: "business_line"
  业务板块: "business_line"
  板块: "business_line"
  部门: "department"
  客户: "customer_name"
  客户名称: "customer_name"
  状态: "status"
  项目名称: "contract_name"
  项目: "contract_name"

# ═══════════════════════════════════════════
# 时间智能 (全局生效)
# ═══════════════════════════════════════════
time_intelligence:
  ytd:
    description: "年初至当前日期的累计值"
    keywords: ["今年", "年初至今", "YTD", "本年度", "当年度", "年度"]
  mtd:
    description: "月初至当前日期的累计值"
    keywords: ["本月", "MTD", "本月份", "当月", "月度"]
  qtd:
    description: "季初至当前日期的累计值"
    keywords: ["本季度", "本季", "QTD", "当季度"]
  yoy:
    description: "与去年同期相比的增长率"
    keywords: ["同比", "YoY", "较去年", "与去年", "去年同期"]
  mom:
    description: "与上月相比的增长率"
    keywords: ["环比", "MoM", "较上月", "与上月", "上月同比"]
  target_completion:
    description: "实际值/目标值×100%"
    keywords: ["目标完成率", "达成率", "完成情况", "KPI完成"]

# ═══════════════════════════════════════════
# 业务域
# ═══════════════════════════════════════════
domains:
  - name: "集团经营总览"
    tables: ["bid_management", "contracts"]
    owner: "市场部"
    visible_to: ["admin", "leader", "employee"]

  - name: "客户全景管理"
    tables: ["contracts"]
    owner: "销售部"
    visible_to: ["admin", "leader", "employee"]

  - name: "商机全生命周期管理"
    tables: ["opportunities"]
    owner: "销售部"
    visible_to: ["admin", "leader"]

  - name: "营收与应收账款管理"
    tables: ["accounts_receivable"]
    owner: "财务部"
    visible_to: ["admin", "leader"]

  - name: "区域与渠道管理"
    tables: ["bid_management"]
    owner: "市场部"
    visible_to: ["admin", "leader", "employee"]

  - name: "风险预警管理"
    tables: ["opportunities", "accounts_receivable"]
    owner: "管理层"
    visible_to: ["admin", "leader"]

  - name: "项目管理"
    tables: ["bid_management", "contracts"]
    owner: "PMO"
    visible_to: ["admin", "leader", "employee"]

  - name: "团队效能"
    tables: ["bid_management"]
    owner: "HR"
    visible_to: ["admin", "leader"]
